# kind runs these control-plane components without exposed metrics endpoints.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [prometheus.localtest.me]
    paths: [/]

grafana:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [grafana.localtest.me]
    path: /
