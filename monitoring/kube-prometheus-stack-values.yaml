alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors from every namespace, not just this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    retention: 2d
    resources:
      requests: {cpu: 200m, memory: 512Mi}

grafana:
  enabled: true
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
