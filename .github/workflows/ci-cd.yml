name: ExpenseFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/expenseflow-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/expenseflow-frontend

jobs:
  backend:
    name: Backend - lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test
        run: pytest -v

  frontend:
    name: Frontend - test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  infra:
    name: Infrastructure - Terraform and Helm checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: terraform validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: |
          helm lint helm/expenseflow -f helm/expenseflow/values-prod.yaml \
            --set backend.image.tag=ci --set frontend.image.tag=ci
          helm template expenseflow helm/expenseflow -f helm/expenseflow/values-prod.yaml \
            --set backend.image.tag=ci --set frontend.image.tag=ci > /dev/null

  build-scan-push:
    name: Build, scan (Trivy) and push images
    needs: [backend, frontend, infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase image names (GHCR requires it)
        run: |
          echo "BACKEND_IMAGE=${BACKEND_IMAGE,,}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE,,}" >> "$GITHUB_ENV"

      - name: Build backend image
        run: >
          docker build ./backend
          --build-arg APP_VERSION=${{ github.sha }}
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          -t "$BACKEND_IMAGE:${{ github.sha }}"

      - name: Build frontend image
        run: >
          docker build ./frontend
          --build-arg VITE_APP_VERSION=${{ github.sha }}
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          -t "$FRONTEND_IMAGE:${{ github.sha }}"

      - name: Trivy scan - backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy scan - frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push "$BACKEND_IMAGE:${{ github.sha }}"
          docker push "$FRONTEND_IMAGE:${{ github.sha }}"
          echo "### Images pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$BACKEND_IMAGE:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$FRONTEND_IMAGE:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  # Set the repo variable DEPLOY_ENABLED=true only while the EKS cluster exists.
  deploy:
    name: Deploy to EKS with Helm
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'expenseflow-eks' }}
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase image names (GHCR requires it)
        run: |
          echo "BACKEND_IMAGE=${BACKEND_IMAGE,,}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE,,}" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-helm@v4

      - name: Point kubectl at the EKS cluster
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Helm upgrade
        run: |
          helm upgrade --install expenseflow ./helm/expenseflow \
            --namespace expenseflow --create-namespace \
            -f helm/expenseflow/values-prod.yaml \
            --set backend.image.repository="$BACKEND_IMAGE" \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.repository="$FRONTEND_IMAGE" \
            --set frontend.image.tag=${{ github.sha }} \
            --wait --timeout 10m

      - name: Show what is running
        run: |
          kubectl get pods,svc,ingress,hpa -n expenseflow
          helm history expenseflow -n expenseflow --max 5
