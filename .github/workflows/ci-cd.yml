name: ExpenseFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/expenseflow-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/expenseflow-frontend

jobs:
  test:
    name: Test (pytest + lint + frontend build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint backend (ruff)
        working-directory: backend
        run: ruff check . && ruff format --check .

      - name: Run backend tests (fails the pipeline on any failure)
        working-directory: backend
        run: pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  build-scan-push:
    name: Build, scan (Trivy) and push images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image names (GHCR requires it)
        run: |
          echo "BACKEND_IMAGE=${BACKEND_IMAGE,,}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE,,}" >> "$GITHUB_ENV"

      - name: Build backend image
        run: >
          docker build ./backend
          --build-arg APP_VERSION=${{ github.sha }}
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          -t "$BACKEND_IMAGE:${{ github.sha }}"

      - name: Build frontend image
        run: >
          docker build ./frontend
          --build-arg VITE_APP_VERSION=${{ github.sha }}
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          -t "$FRONTEND_IMAGE:${{ github.sha }}"

      - name: Trivy scan - backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy scan - frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push "$BACKEND_IMAGE:${{ github.sha }}"
          docker push "$FRONTEND_IMAGE:${{ github.sha }}"
          echo "### Images pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$BACKEND_IMAGE:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$FRONTEND_IMAGE:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
