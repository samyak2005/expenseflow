{{- $fullname := include "expenseflow.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "expenseflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "expenseflow.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "expenseflow.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "expenseflow.postgresHost" . }} -p 5432; do echo waiting for postgres; sleep 2; done
          securityContext:
            runAsUser: 70
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ required "backend.image.tag is required (use the Git commit SHA)" .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $fullname }}-postgres, key: password}}
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.postgres.username }}:$(POSTGRES_PASSWORD)@{{ include "expenseflow.postgresHost" . }}:5432/{{ .Values.postgres.database }}"
            - name: APP_VERSION
              value: {{ .Values.backend.image.tag | quote }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
