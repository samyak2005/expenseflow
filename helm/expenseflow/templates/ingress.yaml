{{- if .Values.ingress.enabled }}
{{- $fullname := include "expenseflow.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "expenseflow.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: {{ $fullname }}-backend, port: {name: http}}
          - path: /docs
            pathType: Prefix
            backend:
              service: {name: {{ $fullname }}-backend, port: {name: http}}
          - path: /openapi.json
            pathType: Exact
            backend:
              service: {name: {{ $fullname }}-backend, port: {name: http}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ $fullname }}-frontend, port: {name: http}}
{{- end }}
